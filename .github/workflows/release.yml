name: Release

# vX.Y.Z 태그 push → 빌드·테스트·인스톨러(Inno Setup 7)·SHA256·릴리즈 자동 발행.
# workflow_dispatch(수동)는 발행 없이 빌드/테스트/아티팩트만 만드는 드라이런.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: 버전 검증 (태그 == Directory.Build.props == .iss)
        id: ver
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          $fileVer = [string]$props.Project.PropertyGroup.VersionPrefix
          $issVer  = (Select-String -Path HangulNotifier_installer.iss -Pattern '#define\s+MyAppVersion\s+"([^"]+)"').Matches[0].Groups[1].Value
          if ([string]::IsNullOrWhiteSpace($fileVer)) { Write-Error 'Directory.Build.props 에 VersionPrefix 없음'; exit 1 }
          if ($fileVer -ne $issVer) { Write-Error "버전 불일치: Directory.Build.props($fileVer) != .iss($issVer)"; exit 1 }

          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $tag = $env:GITHUB_REF -replace '^refs/tags/v',''
            $tagBase = ($tag -split '-')[0]
            if ($tagBase -ne $fileVer) {
              Write-Error "태그($tagBase) != 파일 버전($fileVer). 버전을 맞춰 커밋한 뒤 태그하세요."; exit 1
            }
            $ver = $tag
          } else {
            $ver = $fileVer
          }
          $pre = if ($ver -match '-') { 'true' } else { 'false' }
          "version=$ver"      | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$pre"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "릴리즈 버전: $ver (prerelease=$pre)"

      - name: 테스트
        run: dotnet test -c Release --nologo

      - name: 게시 (프레임워크 종속 단일 파일 · 무압축)
        run: dotnet publish src/HangulNotifier.App/HangulNotifier.App.csproj -c Release -p:PublishProfile=win-x64 --nologo

      - name: Inno Setup 7.0.2 설치
        shell: pwsh
        run: |
          $url = 'https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'innosetup7.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\InnoSetup7' -Wait
          if (-not (Test-Path 'C:\InnoSetup7\ISCC.exe')) { Write-Error 'Inno Setup 7 설치 실패(ISCC.exe 없음)'; exit 1 }
          & 'C:\InnoSetup7\ISCC.exe' | Select-Object -First 1

      - name: 인스톨러 컴파일 (Inno Setup 7)
        shell: pwsh
        run: |
          & 'C:\InnoSetup7\ISCC.exe' HangulNotifier_installer.iss
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC 컴파일 실패($LASTEXITCODE)"; exit $LASTEXITCODE }

      - name: SHA256 체크섬 생성
        shell: pwsh
        run: |
          $ver  = '${{ steps.ver.outputs.version }}'
          $file = "dist\HangulNotifier-Setup-$ver.exe"
          if (-not (Test-Path $file)) { Write-Error "인스톨러 산출물 없음: $file"; exit 1 }
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  HangulNotifier-Setup-$ver.exe" | Out-File -Encoding ascii "$file.sha256"
          Write-Host "SHA256: $hash"

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: HangulNotifier-Setup-${{ steps.ver.outputs.version }}
          path: |
            dist/HangulNotifier-Setup-*.exe
            dist/HangulNotifier-Setup-*.exe.sha256
          if-no-files-found: error

      - name: 릴리즈 발행 (태그 push 에서만)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = '${{ steps.ver.outputs.version }}'
          $pre = '${{ steps.ver.outputs.prerelease }}'

          $auto = gh api "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" -f "tag_name=v$ver" --jq '.body'
          $header = @(
            "**설치:** HangulNotifier-Setup-$ver.exe 실행 (per-user, 관리자 권한 불필요, .NET 8 Desktop Runtime 필요). 첫 실행 시 SmartScreen 경고는 ""추가 정보 → 실행"".",
            "**무결성 검증:** 첨부된 HangulNotifier-Setup-$ver.exe.sha256 의 값과 다운로드 파일의 SHA256을 대조하세요.",
            "**개인정보:** 입력 미저장·미전송, 업데이트 확인은 옵트인(기본 OFF). 자세한 내용은 README 참고.",
            "",
            "---",
            ""
          ) -join "`n"
          ($header + $auto) | Out-File -Encoding utf8 release-notes.md

          $args = @(
            'release','create',"v$ver",
            "dist/HangulNotifier-Setup-$ver.exe",
            "dist/HangulNotifier-Setup-$ver.exe.sha256",
            '--title', "v$ver",
            '--notes-file', 'release-notes.md'
          )
          if ($pre -eq 'true') { $args += '--prerelease' }
          gh @args
          Write-Host "릴리즈 v$ver 발행 완료"
